packages:
  - "packages/*"
  - "apps/*"

linkWorkspacePackages: true
overrides:
  "@pierre/diffs": 1.6.1
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  "@google/genai": false
  electron: true
  electron-winstaller: false
  esbuild: true
  protobufjs: false
  vue-demi: true

minimumReleaseAgeExclude:
  - electron@44.3.0
  - pele@1.6.0
