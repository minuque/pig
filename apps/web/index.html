<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pig</title>
    <link rel="icon" href="/pwa-icon-192.png" type="image/png" />
    <script>
      // Electron 页面解析会换掉 html，preload 里先打的桌面标记会丢；首屏就写上，拖拽和窗控避让才生效
      ;(function () {
        var ua = navigator.userAgent
        if (ua.indexOf("Electron/") === -1) return
        var platform = /Windows/i.test(ua)
          ? "win32"
          : /Mac OS X|Macintosh/i.test(ua)
            ? "darwin"
            : /Linux/i.test(ua)
              ? "linux"
              : ""
        if (platform) document.documentElement.dataset.pigDesktopPlatform = platform
      })()
    </script>
    <script>
      // 首屏主题引导：与 vueuse useColorMode(storageKey: "npg-theme") 同格式；非法/缺失视为 auto
      ;(function () {
        var stored
        try {
          stored = localStorage.getItem("npg-theme")
          if (stored !== "light" && stored !== "dark" && stored !== "auto") {
            stored = "auto"
            localStorage.setItem("npg-theme", stored)
          }
        } catch (e) {
          /* localStorage 不可用时继续使用系统偏好 */
        }

        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)

        if (dark) document.documentElement.classList.add("dark")

        /* 与 use-general-prefs 的 pig.contrast 同键：首帧就写入，不等 main.ts */
        try {
          var boost = localStorage.getItem("pig.contrast")
          if (boost !== null && boost !== "0")
            document.documentElement.style.setProperty("--contrast-boost", boost + "%")
        } catch (e) {
          /* localStorage 不可用时按默认对比度 */
        }

        /* 与 applyAccent 的 pig.accent 同键：首帧只写两个属性，
           色值由 style/palettes.css 的色板给出，不等 Vue 挂载 */
        var GRAYS = {
          indigo: "slate",
          blue: "slate",
          teal: "sage",
          green: "sage",
          orange: "sand",
          red: "mauve",
        }
        try {
          var storedAccent = JSON.parse(localStorage.getItem("pig.accent") || "null")
          var accent = storedAccent && GRAYS[storedAccent.id] ? storedAccent.id : "indigo"
          document.documentElement.setAttribute("data-accent-color", accent)
          document.documentElement.setAttribute("data-gray-color", GRAYS[accent])
        } catch (e) {
          document.documentElement.setAttribute("data-accent-color", "indigo")
          document.documentElement.setAttribute("data-gray-color", "slate")
        }

        /* 与 use-general-prefs 的 pig.glass 同键：默认开，只有显式 off 才关 */
        var glassOn = true
        try {
          glassOn = localStorage.getItem("pig.glass") !== "off"
        } catch (e) {
          /* localStorage 不可用时按默认开启 */
        }
        if (glassOn) document.documentElement.dataset.glass = "on"
      })()
    </script>
    <link rel="stylesheet" href="/src/style/app.css" />
    <script>
      /* 桌面壳据此改窗口底色。放在样式表之后，--background 才有值。 */
      ;(function () {
        if (!window.pigDesktop) return
        var probe = document.createElement("div")
        probe.style.background = "var(--background)"
        document.documentElement.appendChild(probe)
        window.pigDesktop.setThemeColor(getComputedStyle(probe).backgroundColor)
        probe.remove()
      })()
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--background-soft);
      }
    </style>
  </head>

  <body>
    <div id="startup-splash" class="startup-screen" aria-hidden="true">
      <div class="drag-strip"></div>
      <div class="startup-content">
        <div class="startup-mark">
          <img
            class="startup-logo"
            src="/logo-pig.png"
            width="88"
            height="88"
            alt=""
            fetchpriority="low"
          />
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
