<!doctype html>
<html lang="zh-CN" data-accent-color="indigo" data-gray-color="gray">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pig</title>
    <link rel="icon" href="/pwa-icon-192.png" type="image/png" />
    <script>
      // Electron 页面解析会换掉 html，preload 里先打的桌面标记会丢；首屏就写上，拖拽和窗控避让才生效
      ;(function () {
        var ua = navigator.userAgent
        if (ua.indexOf("Electron/") === -1) return
        var platform = /Windows/i.test(ua)
          ? "win32"
          : /Mac OS X|Macintosh/i.test(ua)
            ? "darwin"
            : /Linux/i.test(ua)
              ? "linux"
              : ""
        if (platform) document.documentElement.dataset.pigDesktopPlatform = platform
      })()
    </script>
    <script>
      // 首屏主题引导：与 vueuse useColorMode(storageKey: "npg-theme") 同格式；非法/缺失视为 auto
      ;(function () {
        var stored
        try {
          stored = localStorage.getItem("npg-theme")
          if (stored !== "light" && stored !== "dark" && stored !== "auto") {
            stored = "auto"
            localStorage.setItem("npg-theme", stored)
          }
        } catch (e) {
          /* localStorage 不可用时继续使用系统偏好 */
        }

        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)

        if (dark) document.documentElement.classList.add("dark")

        try {
          var preset = localStorage.getItem("pig.themePreset")
          var presets = {
            paper: { accent: "orange", light: "#fbf9f5", dark: "#141210" },
            ocean: { accent: "blue", light: "#f8fafc", dark: "#0e131b" },
            grove: { accent: "green", light: "#f8faf8", dark: "#0f1412" },
            iris: { accent: "violet", light: "#faf9fc", dark: "#121017" },
          }
          if (preset && presets[preset]) {
            var item = presets[preset]
            document.documentElement.dataset.themePreset = preset
            document.documentElement.dataset.accentColor = item.accent
            document.documentElement.style.setProperty("--bg", dark ? item.dark : item.light)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="/src/style/app.css" />
    <script>
      /* 桌面壳据此改窗口底色。放在样式表之后，--bg 才有值。 */
      ;(function () {
        if (!window.pigDesktop) return
        var probe = document.createElement("div")
        probe.style.background = "var(--bg)"
        document.documentElement.appendChild(probe)
        window.pigDesktop.setThemeColor(getComputedStyle(probe).backgroundColor)
        probe.remove()
      })()
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>

  <body>
    <div id="startup-splash" class="startup-screen" aria-hidden="true">
      <div class="drag-strip"></div>
      <div class="startup-content">
        <div class="startup-mark">
          <img
            class="startup-logo"
            src="/logo-pig.png"
            width="88"
            height="88"
            alt=""
            fetchpriority="low"
          />
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
