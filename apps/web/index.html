<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pig</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <script>
      // 首屏主题引导：与 vueuse useColorMode(storageKey: "npg-theme") 同格式；非法/缺失视为 auto
      ;(function () {
        var stored
        try {
          stored = localStorage.getItem("npg-theme")
          if (stored !== "light" && stored !== "dark" && stored !== "auto") {
            stored = "auto"
            localStorage.setItem("npg-theme", stored)
          }
        } catch (e) {
          /* localStorage 不可用时继续使用系统偏好 */
        }
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      })()
    </script>
    <link rel="stylesheet" href="/src/style/app.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--canvas-soft);
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" class="startup-screen" aria-hidden="true">
      <div class="startup-veil"></div>
      <div class="drag-strip"></div>
      <div class="startup-content">
        <div class="startup-mark motion-card-glow">
          <img class="startup-logo" src="/logo.png" width="88" height="88" alt="" />
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
