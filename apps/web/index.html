<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pig</title>
    <script>
      // 首屏主题引导：与 vueuse useColorMode(storageKey: "npg-theme") 同格式；非法/缺失视为 auto
      ;(function () {
        var stored
        try {
          stored = localStorage.getItem("npg-theme")
          if (stored !== "light" && stored !== "dark" && stored !== "auto") {
            stored = "auto"
            localStorage.setItem("npg-theme", stored)
          }
        } catch (e) {
          /* localStorage 不可用时继续使用系统偏好 */
        }
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      })()
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f9fafb;
      }
      html.dark,
      html.dark body {
        background: #1b1b1c;
      }
      #startup-splash {
        position: fixed;
        z-index: 30;
        inset: 0;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, #f9fafb 80%, transparent);
        -webkit-backdrop-filter: blur(12px) saturate(1.14);
        backdrop-filter: blur(12px) saturate(1.14);
      }
      html.dark #startup-splash {
        background: color-mix(in srgb, #121212 80%, transparent);
        -webkit-backdrop-filter: blur(16px) saturate(1.08);
        backdrop-filter: blur(16px) saturate(1.08);
      }
      #startup-splash img {
        width: 96px;
        height: 96px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" aria-hidden="true">
      <img src="/logo.png" width="96" height="96" alt="" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
