    <script>
      // Electron 页面解析会换掉 html，preload 里先打的桌面标记会丢；首屏就写上，拖拽和窗控避让才生效
      ;(function () {
        var ua = navigator.userAgent
        if (ua.indexOf("Electron/") === -1) return
        var platform = /Windows/i.test(ua)
          ? "win32"
          : /Mac OS X|Macintosh/i.test(ua)
            ? "darwin"
            : /Linux/i.test(ua)
              ? "linux"
              : ""
        if (platform) document.documentElement.dataset.pigDesktopPlatform = platform
      })()
    </script>

        var stored
        try {
          stored = localStorage.getItem("npg-theme")
          if (stored !== "light" && stored !== "dark" && stored !== "auto") {
            stored = "auto"
            localStorage.setItem("npg-theme", stored)
          }
        } catch (e) {
          /* localStorage 不可用时继续使用系统偏好 */
        }

        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)

        if (dark) document.documentElement.classList.add("dark")

        /* 与 use-general-prefs 的 pig.contrast 同键：首帧就写入，不等 main.ts */
        try {
          var boost = localStorage.getItem("pig.contrast")
          if (boost !== null && boost !== "0")
            document.documentElement.style.setProperty("--contrast-boost", boost + "%")

        }

            var scale = scales[accent.id]
            if (scale) {
              var hex = dark ? scale.d : scale.l
              var root = document.documentElement.style
              root.setProperty("--accent-9", hex[0])
              root.setProperty("--accent-10", hex[1])
              root.setProperty("--accent-11", hex[2])
              root.setProperty("--accent-a3", hex[3])
              root.setProperty("--accent-a4", hex[4])
              root.setProperty("--accent-a6", hex[5])
              root.setProperty("--accent-a9", hex[6])
              root.setProperty("--accent-contrast", scale.c ? "var(--white)" : "var(--foreground)")
            }
          }
        } catch (e) {
          /* 缓存损坏时按默认 accent */
        }

        /* 与 use-general-prefs 的 pig.glass 同键：默认开，只有显式 off 才关 */
        var glassOn = true
        try {
          glassOn = localStorage.getItem("pig.glass") !== "off"
        } catch (e) {
          /* localStorage 不可用时按默认开启 */
        }
        if (glassOn) document.documentElement.dataset.glass = "on"
      })()

    <link rel="stylesheet" href="/src/style/app.css" />
    <script>
      /* 桌面壳据此改窗口底色。放在样式表之后，--background 才有值。 */
      ;(function () {
        if (!window.pigDesktop) return
        var probe = document.createElement("div")
        probe.style.background = "var(--background)"
        document.documentElement.appendChild(probe)
        window.pigDesktop.setThemeColor(getComputedStyle(probe).backgroundColor)
        probe.remove()
      })()
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--background-soft);
      }

            class="startup-logo"

            width="88"
