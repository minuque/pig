<!doctype html>
<!--
  ══════════════════════════════════════════════════════════════════════════
  PROTOTYPE — throwaway, 不进 main 的正式代码
  问题:工作台主布局应该长什么样?
  计划:三个结构完全不同的变体,通过 ?variant=a|b|c 或底部浮条 ←/→ 切换。
    A · 三栏常驻      — 参考图(Wave Terminal)直译:左 Session 导航 / 中 Transcript / 右上下文面板
                       (Session 列表已按反馈替换为 B 的卡片实现:标题+预览+状态)
    B · 两栏+按需抽屉  — Transcript 阅读优先,Run/诊断上下文收进默认关闭的右侧抽屉
    C · 标签页+总览    — 顶部 Session 标签 + "指挥中心"总览页(跨 Session 并行 Run 是一等公民)
  约束:DESIGN.md(Notion 语言:暖纸底 / 单一蓝 / hairline / sticker 色仅装饰)
       ui-guidelines.md(状态文字+颜色双编码;不可用操作说明原因)
       spec.md §6(无文件浏览器 / PTY / 进程面板 → 右栏放 Run·Session·Gateway 上下文)
  ══════════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE · 工作台布局 (?variant=a|b|c)</title>
    <style>
      /* ── DESIGN.md tokens ─────────────────────────────────────────── */
      :root {
        --primary: #0075de;
        --primary-active: #005bab;
        --secondary: #213183;
        --on-primary: #ffffff;
        --canvas: #ffffff;
        --canvas-soft: #f6f5f4;
        --surface: #ffffff;
        --ink: #000000;
        --ink-2: #31302e;
        --ink-muted: #615d59;
        --ink-faint: #a39e98;
        --hairline: #e6e6e6;
        --accent-sky: #62aef0;
        --accent-purple: #d6b6f6;
        --accent-purple-deep: #391c57;
        --accent-pink: #ff64c8;
        --accent-orange: #dd5b00;
        --accent-orange-deep: #793400;
        --accent-teal: #2a9d99;
        --accent-green: #1aae39;
        --r-xs: 4px;
        --r-sm: 5px;
        --r-md: 8px;
        --r-lg: 12px;
        --r-xl: 16px;
        --r-full: 9999px;
        --shadow-1:
          rgba(0, 0, 0, 0.01) 0 0.175px 1.041px, rgba(0, 0, 0, 0.02) 0 0.8px 2.925px,
          rgba(0, 0, 0, 0.027) 0 2.025px 7.847px, rgba(0, 0, 0, 0.04) 0 4px 18px;
        --shadow-2:
          rgba(0, 0, 0, 0.01) 0 0.175px 1.041px, rgba(0, 0, 0, 0.02) 0 0.8px 2.925px,
          rgba(0, 0, 0, 0.027) 0 2.025px 7.847px, rgba(0, 0, 0, 0.04) 0 4px 18px,
          rgba(0, 0, 0, 0.05) 0 23px 52px;
        --font:
          Inter, -apple-system, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--canvas-soft);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.33;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      input,
      textarea {
        font-family: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
        border-radius: var(--r-xs);
      }

      /* ── shared primitives (DESIGN.md components) ─────────────────── */
      .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
        border: 0;
        border-radius: var(--r-full);
        font-size: 15px;
        font-weight: 500;
        padding: 7px 18px;
      }
      .btn-primary:active {
        background: var(--primary-active);
        transform: scale(0.97);
      }
      .btn-utility {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--hairline);
        border-radius: var(--r-md);
        font-size: 14px;
        font-weight: 500;
        padding: 4px 14px;
      }
      .btn-utility:hover {
        background: var(--canvas-soft);
      }
      .btn-utility:disabled {
        color: var(--ink-faint);
        cursor: not-allowed;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--r-lg);
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.125px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: var(--r-full);
        flex: none;
        display: inline-block;
      }
      .dot.pulse {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--r-full);
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.125px;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .kbd-hint {
        font-size: 12px;
        color: var(--ink-faint);
      }
      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }

      /* ── shared workbench blocks (数据渲染,非布局) ─────────────────── */
      .msg {
        margin-bottom: 20px;
      }
      .msg-prompt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .msg-prompt .who {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: var(--r-full);
        background: var(--ink);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        display: grid;
        place-items: center;
      }
      .msg-prompt .text {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--r-lg);
        padding: 10px 14px;
        flex: 1;
        line-height: 1.5;
      }
      .msg-agent .md p {
        margin: 0 0 10px;
        line-height: 1.55;
      }
      .msg-agent .md ul {
        margin: 0 0 10px;
        padding-left: 20px;
        line-height: 1.55;
      }
      .msg-agent .md code {
        font-family: var(--mono);
        font-size: 12.5px;
        background: var(--canvas-soft);
        border: 1px solid var(--hairline);
        border-radius: var(--r-xs);
        padding: 1px 5px;
      }
      pre.codeblock {
        background: var(--canvas-soft);
        border: 1px solid var(--hairline);
        border-radius: var(--r-md);
        padding: 12px 14px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.5;
        margin: 0 0 10px;
      }
      pre.codeblock .cm {
        color: var(--ink-faint);
      }
      pre.codeblock .kw {
        color: var(--accent-purple-deep);
      }
      pre.codeblock .str {
        color: var(--accent-orange-deep);
      }
      details.fold {
        border: 1px solid var(--hairline);
        border-radius: var(--r-md);
        background: var(--surface);
        margin-bottom: 10px;
      }
      details.fold > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        font-size: 13px;
        color: var(--ink-muted);
        user-select: none;
      }
      details.fold > summary::-webkit-details-marker {
        display: none;
      }
      details.fold > summary::before {
        content: "▸";
        font-size: 11px;
        color: var(--ink-faint);
        transition: transform 0.15s;
      }
      details.fold[open] > summary::before {
        transform: rotate(90deg);
      }
      details.fold .fold-body {
        border-top: 1px solid var(--hairline);
        padding: 10px 12px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-2);
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .tool-tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.125px;
        border: 1px solid var(--hairline);
        border-radius: var(--r-sm);
        padding: 1px 6px;
        color: var(--ink-2);
        background: var(--canvas-soft);
      }
      .stream-cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: var(--primary);
        border-radius: 2px;
        vertical-align: -2px;
        animation: pulse 1s steps(2) infinite;
      }
      .banner {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid var(--hairline);
        border-left: 3px solid var(--accent-orange);
        border-radius: var(--r-md);
        background: var(--surface);
        padding: 12px 14px;
        margin-bottom: 20px;
      }
      .banner.deep {
        border-left-color: var(--accent-orange-deep);
      }
      .banner .b-title {
        font-weight: 600;
        margin-bottom: 2px;
      }
      .banner .b-sub {
        font-size: 13px;
        color: var(--ink-muted);
        line-height: 1.5;
      }

      /* composer(Steer 与 Run 状态已并入,参考 B 的克制呈现) */
      .composer {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-1);
        padding: 10px 12px 8px;
      }
      .composer .c-status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--hairline);
        font-size: 12px;
      }
      .composer textarea {
        width: 100%;
        border: 0;
        resize: none;
        font-size: 15px;
        line-height: 1.45;
        outline: none;
        background: transparent;
        color: var(--ink);
      }
      .composer .c-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .composer .c-note {
        font-size: 12px;
        color: var(--ink-faint);
      }
      .composer.disabled {
        opacity: 1;
        background: var(--canvas-soft);
      }

      /* ── Variant A · 三栏常驻 ─────────────────────────────────────── */
      .va-shell {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 300px;
        height: 100vh;
      }
      .va-left {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--hairline);
        background: var(--canvas-soft);
        min-height: 0;
      }
      .va-brand {
        padding: 14px 16px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .va-wordmark {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .va-new {
        margin: 2px 12px 10px;
      }
      .va-nav {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 12px;
      }
      .va-ws {
        padding: 10px 8px 4px;
      }
      .va-ws .n {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.125px;
        color: var(--ink-muted);
        text-transform: uppercase;
      }
      .va-ws .p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-faint);
        margin-top: 1px;
      }
      /* A 的 Session 列表已按用户选定替换为 B 的卡片实现,此处仅补间距适配 */
      .va-nav .vb-card {
        margin-bottom: 6px;
        padding: 10px 12px;
      }
      .va-leftfoot {
        border-top: 1px solid var(--hairline);
        padding: 10px 16px;
        font-size: 12px;
        color: var(--ink-muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .va-center {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--canvas-soft);
      }
      .va-head {
        border-bottom: 1px solid var(--hairline);
        background: var(--surface);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .va-head h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.125px;
        margin: 0;
      }
      .va-head .sub {
        font-size: 12px;
        color: var(--ink-faint);
        font-family: var(--mono);
      }
      .va-transcript {
        flex: 1;
        overflow-y: auto;
        padding: 24px 28px 8px;
      }
      .va-dock {
        padding: 12px 28px 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .va-right {
        border-left: 1px solid var(--hairline);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .va-tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--hairline);
        padding: 8px 12px 0;
      }
      .va-tab {
        border: 0;
        background: transparent;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-muted);
        padding: 7px 10px;
        border-bottom: 2px solid transparent;
      }
      .va-tab.active {
        color: var(--ink);
        border-bottom-color: var(--primary);
      }
      .va-panel {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border-bottom: 1px solid var(--hairline);
        font-size: 13px;
      }
      .kv:last-child {
        border-bottom: 0;
      }
      .kv .k {
        color: var(--ink-muted);
      }
      .kv .v {
        font-weight: 500;
        text-align: right;
      }
      .sect-label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.125px;
        color: var(--ink-muted);
        margin: 4px 0 -4px;
      }

      /* ── Variant B · 两栏 + 按需抽屉 ──────────────────────────────── */
      .vb-shell {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        height: 100vh;
        position: relative;
      }
      .vb-left {
        border-right: 1px solid var(--hairline);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .vb-wspick {
        margin: 14px 14px 10px;
        border: 1px solid var(--hairline);
        border-radius: var(--r-md);
        padding: 9px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--canvas-soft);
        width: calc(100% - 28px);
        text-align: left;
        cursor: pointer;
      }
      .vb-wspick .n {
        font-weight: 600;
        font-size: 14px;
      }
      .vb-wspick .p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-faint);
      }
      .vb-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .vb-card {
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--r-lg);
        padding: 12px 14px;
        width: 100%;
        cursor: pointer;
      }
      .vb-card:hover {
        box-shadow: var(--shadow-1);
      }
      .vb-card.active {
        border-color: var(--primary);
        box-shadow: var(--shadow-1);
      }
      .vb-card .t {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 3px;
      }
      .vb-card .prev {
        font-size: 13px;
        color: var(--ink-muted);
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .vb-card .m {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-faint);
      }
      .vb-card.unavailable {
        background: var(--canvas-soft);
      }
      .vb-card.unavailable .t {
        color: var(--ink-faint);
      }
      .vb-leftfoot {
        border-top: 1px solid var(--hairline);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--ink-muted);
      }
      .vb-center {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .vb-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--hairline);
        background: var(--canvas-soft);
      }
      .vb-top h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .vb-scroll {
        flex: 1;
        overflow-y: auto;
      }
      .vb-col {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 32px 12px;
      }
      .vb-dock {
        max-width: 720px;
        margin: 0 auto;
        padding: 10px 32px 20px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .vb-scrim {
        position: absolute;
        inset: 0;
        background: rgba(33, 24, 21, 0.18);
        z-index: 30;
      }
      .vb-drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 340px;
        background: var(--surface);
        border-left: 1px solid var(--hairline);
        box-shadow: var(--shadow-2);
        z-index: 31;
        display: flex;
        flex-direction: column;
      }
      .vb-drawer .d-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--hairline);
        font-weight: 600;
      }
      .vb-drawer .d-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ── Variant C · 标签页 + 并行总览 ────────────────────────────── */
      .vc-shell {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        height: 100vh;
      }
      .vc-rail {
        border-right: 1px solid var(--hairline);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0;
        gap: 4px;
      }
      .vc-railbtn {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: var(--r-md);
        background: transparent;
        color: var(--ink-muted);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .vc-railbtn:hover {
        background: var(--canvas-soft);
      }
      .vc-railbtn.active {
        background: var(--canvas-soft);
        color: var(--primary);
      }
      .vc-rail .spacer {
        flex: 1;
      }
      .vc-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .vc-tabbar {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 8px 12px 0;
        border-bottom: 1px solid var(--hairline);
        background: var(--canvas-soft);
        overflow-x: auto;
      }
      .vc-tab {
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid transparent;
        border-bottom: 0;
        background: transparent;
        border-radius: var(--r-md) var(--r-md) 0 0;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-muted);
        white-space: nowrap;
        cursor: pointer;
      }
      .vc-tab.active {
        background: var(--surface);
        border-color: var(--hairline);
        color: var(--ink);
        position: relative;
      }
      .vc-tab.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: var(--surface);
      }
      .vc-tab .x {
        color: var(--ink-faint);
        font-size: 13px;
        padding: 0 2px;
        border-radius: var(--r-xs);
      }
      .vc-tab .x:hover {
        color: var(--ink);
      }
      .vc-plus {
        border: 0;
        background: transparent;
        color: var(--ink-muted);
        font-size: 16px;
        padding: 6px 8px;
        border-radius: var(--r-md);
        cursor: pointer;
      }
      .vc-plus:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .vc-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--surface);
      }
      .vc-overview {
        flex: 1;
        overflow-y: auto;
      }
      /* 唯一的深色岛 — DESIGN.md hero-band 的合规用法,致敬参考图的深色气质 */
      .vc-hero {
        background: var(--secondary);
        color: var(--on-primary);
        padding: 26px 32px;
        position: relative;
        overflow: hidden;
      }
      .vc-hero h2 {
        margin: 0 0 4px;
        font-size: 24px;
        font-weight: 700;

      /* ── shared render helpers ────────────────────────────────────── */
      const wsById = (id) => workspaces.find((w) => w.id === id);

      function runBadge(state) {
        const m = RUN_META[state];
        return `<span class="badge"><span class="dot${m.pulse ? " pulse" : ""}" style="background:${m.color}"></span>${state}</span>`;
      }
      function connBadge() {
        return `<span class="dot" style="background:var(--accent-green)"></span>${gateway.connection}`;
      }

      function renderMessage(msg) {
        switch (msg.kind) {
          case "prompt":
            return `<div class="msg msg-prompt"><span class="who">我</span><div class="text">${msg.text}</div></div>`;
          case "thinking":
            return `<details class="fold"><summary><span class="tool-tag">思考</span>${msg.title}</summary><div class="fold-body">${msg.body}</div></details>`;
          case "tool":
            return `<details class="fold"><summary><span class="tool-tag">${msg.name}</span><span class="mono">${msg.desc}</span></summary><div class="fold-body">${msg.result}</div></details>`;
          case "md":
            return `<div class="msg msg-agent"><div class="md">${msg.html}</div></div>`;
          case "code":
            return `<pre class="codeblock">${msg.html}</pre>`;
          case "stream":
            return `<div class="msg msg-agent"><div class="md"><p>${msg.text} <span class="stream-cursor" aria-label="正在输出"></span></p></div></div>`;
          case "end": {
            const deep = msg.state === "Interrupted";
            const retry =
              msg.state === "Interrupted"
                ? `<div style="margin-top:8px"><button class="btn-utility" data-action="noop">重试(创建新 Run)</button></div>`
                : "";
            return `<div class="banner${deep ? " deep" : ""}"><div><div class="b-title">${runBadge(msg.state)}</div><div class="b-sub">${msg.note}</div>${retry}</div></div>`;
          }
        }
        return "";
      }

      function renderTranscript(s) {
        const unavailable =
          s.availability === "Unavailable"
            ? `<div class="banner deep"><div><div class="b-title"><span class="badge"><span class="dot" style="background:var(--accent-orange-deep)"></span>Unavailable</span></div><div class="b-sub">${s.unavailableReason}。可以查看最后验证的信息,但拒绝新的 Run 和 Session 修改。<br>最后验证:${s.lastVerified}</div></div></div>`
            : "";
        return unavailable + s.messages.map(renderMessage).join("");
      }

      function renderComposer(s) {
        if (s.availability === "Unavailable") {
          return `<div class="composer disabled"><div class="c-row" style="margin-top:0"><span class="c-note">Unavailable Session 拒绝新的 Run — ${s.unavailableReason}</span></div></div>`;
        }
        const running = s.run && (s.run.state === "Running" || s.run.state === "Cancelling");
        const model = s.run ? `${s.run.model} · ${s.run.thinking}` : "claude-opus-4-8 · high";

          ? `<div class="c-status">${runBadge(s.run.state)}<span class="kbd-hint mono">${s.run.elapsed || ""}</span>${s.queue.length ? `<span class="kbd-hint">队列 ${s.queue.length}(FIFO)</span>` : ""}<span style="flex:1"></span><button class="btn-utility" data-action="noop">取消 Run</button></div>`
          : "";
        const note = running
          ? "Steer 纠偏当前 Run,不创建新 Run;发送则按 FIFO 排队"
          : "模型与 thinking level 在 admission 时冻结";
        const placeholder = running
          ? "输入内容 — 用 Steer 纠偏当前 Run,或发送新 prompt 排队…"
          : `给 ${s.title} 发送 prompt…`;
        return `<div class="composer">
          ${statusRow}
          <textarea rows="2" placeholder="${placeholder}" aria-label="Prompt 输入"></textarea>
          <div class="c-row">
            <span class="badge">${model}</span>
            <span class="c-note">${note}</span>
            <span style="flex:1"></span>

          </div>
        </div>`;
      }

      function renderContextPanel(s) {
        const kv = (k, v) =>
          `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
        let runBlock;
        if (s.availability === "Unavailable") {
          runBlock = `<div class="banner deep" style="margin:0"><div><div class="b-title">Unavailable</div><div class="b-sub">${s.unavailableReason}</div></div></div>`;

          runBlock = `
            <div class="card" style="padding:14px">

            <div class="sect-label">EXECUTION PROFILE</div>
            <div class="card" style="padding:14px">
              ${kv("模型", s.run.model)}
              ${kv("Thinking", s.run.thinking)}
              ${kv("冻结于", "admission")}

                    .join("")}</div>`
                : ""

          runBlock = `<div class="card" style="padding:14px;color:var(--ink-muted);font-size:13px">尚无 Run。发送 prompt 即创建。</div>`;
        }

          run: runBlock,
          session: `<div class="card" style="padding:14px">
            ${kv("状态", s.availability)}
            ${kv("Workspace", wsById(s.ws).name)}
            ${kv("更新", s.updated)}

            ${kv("监听", `<span class="mono">${gateway.addr}</span>`)}
            ${kv("Pi Runtime", gateway.pi)}
            ${kv("Local Identity", gateway.identity)}
            ${kv("运行时长", gateway.uptime)}

          </div>`,
        };
      }

                return `<button class="vb-card${act}${un}" data-action="select" data-id="${x.id}">

            return `<div class="va-ws"><div class="n">${w.name}</div><div class="p">${w.path}</div></div>${rows}`;
          })

        return `<div class="va-shell">
          <aside class="va-left">
            <div class="va-brand"><span class="va-wordmark">工作台</span><span class="kbd-hint">v2</span></div>
            <button class="btn-primary va-new" data-action="noop">+ 新建 Session</button>

          </aside>
          <main class="va-center">
            <div class="va-head">
              <h1>${s.title}</h1>
              ${s.run ? runBadge(s.run.state) : ""}
              <span style="flex:1"></span>
              <span class="sub">${wsById(s.ws).path}</span>
            </div>
            <div class="va-transcript">${renderTranscript(s)}</div>
            <div class="va-dock">${renderComposer(s)}</div>
          </main>
          <aside class="va-right">
            <div class="va-tabs" role="tablist">
              ${["run", "session", "gateway"]
                .map(
                  (t) =>
                    `<button class="va-tab${state.rightTab === t ? " active" : ""}" data-action="tab" data-id="${t}" role="tab">${{ run: "Run", session: "Session", gateway: "Gateway" }[t]}</button>`,
                )
                .join("")}
            </div>
            <div class="va-panel">${panels[state.rightTab]}</div>
          </aside>
        </div>`;
      }

      /* ── Variant B · 两栏 + 按需抽屉(阅读优先) ────────────────────── */
      function renderB(state) {
        const s = sessions.find((x) => x.id === state.sessionId);
        const w = wsById(s.ws);
        const panels = renderContextPanel(s);
        const list = sessions
          .map((x) => {
            const act = x.id === state.sessionId ? " active" : "";
            const un = x.availability === "Unavailable" ? " unavailable" : "";
            const meta =
              x.availability === "Unavailable"
                ? `<span class="dot" style="background:var(--accent-orange-deep)"></span>Unavailable · ${x.updated}`
                : x.run
                  ? `<span class="dot${RUN_META[x.run.state].pulse ? " pulse" : ""}" style="background:${RUN_META[x.run.state].color}"></span>${x.run.state} · ${x.updated}`
                  : x.updated;
            return `<button class="vb-card${act}${un}" data-action="select" data-id="${x.id}">
              <div class="t">${x.title}</div>
              <div class="prev">${x.preview}</div>
              <div class="m">${meta}<span style="flex:1"></span><span>${wsById(x.ws).name}</span></div>
            </button>`;
          })
          .join("");

        const drawer = state.drawerOpen
          ? `<div class="vb-scrim" data-action="drawer-close"></div>
             <div class="vb-drawer" role="dialog" aria-label="Run 与上下文详情">
               <div class="d-head">Run 与上下文<button class="btn-utility" data-action="drawer-close" aria-label="关闭抽屉">✕</button></div>
               <div class="d-body">
                 <div class="sect-label">RUN</div>${panels.run}
                 <div class="sect-label">SESSION</div>${panels.session}
                 <div class="sect-label">GATEWAY</div>${panels.gateway}
               </div>
             </div>`
          : "";

        return `<div class="vb-shell">
          <aside class="vb-left">
            <button class="vb-wspick" data-action="noop">
              <span><span class="n">${w.name}</span><br><span class="p">${w.path}</span></span>
              <span aria-hidden="true">▾</span>
            </button>
            <div style="padding:0 14px 10px"><button class="btn-primary" style="width:100%" data-action="noop">+ 新建 Session</button></div>
            <div class="vb-list">${list}</div>
            <div class="vb-leftfoot"><span style="display:inline-flex;align-items:center;gap:8px">${connBadge()}</span><span class="mono">${gateway.addr}</span></div>
          </aside>
          <main class="vb-center">
            <div class="vb-top">
              <h1>${s.title}</h1>
              ${s.run ? runBadge(s.run.state) : ""}
              <span style="flex:1"></span>
              <button class="btn-utility" data-action="drawer-open">详情</button>
            </div>
            <div class="vb-scroll"><div class="vb-col">${renderTranscript(s)}</div></div>
            <div style="border-top:1px solid var(--hairline)"><div class="vb-dock">${renderComposer(s)}</div></div>
          </main>
          ${drawer}
        </div>`;
      }

      /* ── Variant C · 标签页 + 并行总览(指挥中心) ───────────────────── */
      const ICONS = {
        home: '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 7l6-5 6 5v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>',
        ws: '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5a1 1 0 0 1 1-1h4l2 2h4a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>',
        gear: '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg>',
      };

      function renderC(state) {
        const openTabs = state.tabs.map((id) => sessions.find((x) => x.id === id));
        const inOverview = state.cTab === "overview";

        const tabsHtml = [
          `<button class="vc-tab${inOverview ? " active" : ""}" data-action="ctab" data-id="overview">${ICONS.home} 总览</button>`,
          ...openTabs.map((s) => {
            const dot = s.run
              ? `<span class="dot${RUN_META[s.run.state].pulse ? " pulse" : ""}" style="background:${RUN_META[s.run.state].color}"></span>`
              : "";
            return `<button class="vc-tab${!inOverview && state.cTab === s.id ? " active" : ""}" data-action="ctab" data-id="${s.id}">${dot}${s.title}<span class="x" data-action="ctab-close" data-id="${s.id}" aria-label="关闭标签">×</span></button>`;
          }),
          `<button class="vc-plus" data-action="noop" aria-label="打开更多 Session">+</button>`,
        ].join("");

        let body;
        if (inOverview) {
          const active = sessions.filter(
            (s) => s.run && ["Running", "Cancelling"].includes(s.run.state),
          );
          const queuedCount = sessions.reduce((n, s) => n + s.queue.length, 0);
          const recent = sessions.filter(
            (s) => s.run && ["Completed", "Failed", "Interrupted"].includes(s.run.state),
          );
          body = `<div class="vc-overview">
            <div class="vc-hero">
              <span class="sticker" style="width:52px;height:52px;background:var(--accent-purple);top:18px;right:120px"></span>
              <span class="sticker" style="width:14px;height:14px;background:var(--accent-pink);top:64px;right:96px"></span>
              <span class="sticker" style="width:22px;height:22px;background:var(--accent-sky);top:30px;right:64px"></span>
              <span class="sticker" style="width:9px;height:9px;background:var(--accent-teal);top:78px;right:150px"></span>
              <h2>${active.length} 个 Session 正在工作</h2>
              <div class="sub">${active.length} 个 Running · ${queuedCount} 个 Queued · 跨 Session 有界并行</div>
            </div>
            <div class="vc-ov-inner">
              <div class="eyebrow" style="color:var(--ink-muted)">ACTIVE RUNS</div>
              <div class="vc-grid">
                ${active
                  .map(
                    (s) => `<div class="vc-runcard">
                      <div style="display:flex;justify-content:space-between;align-items:center"><span class="t">${s.title}</span>${runBadge(s.run.state)}</div>
                      <span class="kbd-hint mono">${wsById(s.ws).path}</span>
                      <span class="kbd-hint">${s.run.id} · ${s.run.model} / ${s.run.thinking} · 已运行 ${s.run.elapsed}${s.queue.length ? ` · 队列 ${s.queue.length}` : ""}</span>
                      <div class="live">${s.live || "(等待输出)"}</div>
                      <button class="open" data-action="ctab" data-id="${s.id}">打开 Session →</button>
                    </div>`,
                  )
                  .join("")}
              </div>
              <div class="eyebrow" style="color:var(--ink-muted)">最近终态</div>
              <div class="vc-recent" style="margin-top:12px">
                ${recent
                  .map(
                    (s) =>
                      `<div class="row">${runBadge(s.run.state)}<span class="t">${s.title}</span><span class="meta">${s.run.id}</span><span class="meta">${s.updated}</span></div>`,
                  )
                  .join("")}
              </div>
            </div>
          </div>`;
        } else {
          const s = sessions.find((x) => x.id === state.cTab);
          body = `<div class="vc-sesshead">
              <h1>${s.title}</h1>${s.run ? runBadge(s.run.state) : ""}
              <span class="kbd-hint mono">${s.run ? `${s.run.id} · ${s.run.model} / ${s.run.thinking}` : ""}</span>
              <span style="flex:1"></span><span class="kbd-hint">${connBadge()}</span>
            </div>
            <div class="vc-scroll"><div class="vc-col">${renderTranscript(s)}</div></div>
            <div class="vc-dock"><div class="vc-dock-inner">${renderComposer(s)}</div></div>`;
        }

        return `<div class="vc-shell">
          <nav class="vc-rail" aria-label="主导航">
            <button class="vc-railbtn${inOverview ? " active" : ""}" data-action="ctab" data-id="overview" aria-label="总览">${ICONS.home}</button>
            <button class="vc-railbtn" data-action="noop" aria-label="Workspace 管理">${ICONS.ws}</button>
            <button class="vc-railbtn" data-action="noop" aria-label="设置">${ICONS.gear}</button>
            <span class="spacer"></span>
            <span class="dot" style="background:var(--accent-green)" title="${gateway.connection}"></span>
          </nav>
          <div class="vc-main">
            <div class="vc-tabbar">${tabsHtml}</div>
            <div class="vc-body">${body}</div>
          </div>
        </div>`;
      }

      /* ── switcher + state ─────────────────────────────────────────── */
      const VARIANTS = [
        { key: "a", label: "A · 三栏常驻" },
        { key: "b", label: "B · 两栏 + 按需抽屉" },
        { key: "c", label: "C · 标签页 + 并行总览" },
      ];

      const params = new URLSearchParams(location.search);
      const state = {
        variant: VARIANTS.some((v) => v.key === (params.get("variant") || "").toLowerCase())
          ? params.get("variant").toLowerCase()
          : "a",
        sessionId: "s1",
        rightTab: "run",
        drawerOpen: false,
        tabs: ["s1", "s5"],
        cTab: "overview",
      };

      function setVariant(key) {
        state.variant = key;
        try {
          const url = new URL(location.href);
          url.searchParams.set("variant", key);
          history.replaceState(null, "", url);
        } catch {
          /* file:// 协议下 replaceState 被禁,切换仍然可用,只是 URL 不更新 */
        }
        render();
      }

      function render() {
        const app = document.getElementById("app");
        app.innerHTML = { a: renderA, b: renderB, c: renderC }[state.variant](state);
        document.getElementById("sw-label").textContent = VARIANTS.find(
          (v) => v.key === state.variant,
        ).label;
      }

      function cycle(dir) {
        const i = VARIANTS.findIndex((v) => v.key === state.variant);
        setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
      }

      document.getElementById("sw-prev").addEventListener("click", () => cycle(-1));
      document.getElementById("sw-next").addEventListener("click", () => cycle(1));

      document.addEventListener("keydown", (e) => {
        const t = e.target;
        if (t.matches("input, textarea, [contenteditable]")) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
      });

      document.getElementById("app").addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        const { action, id } = el.dataset;
        if (action === "select") {
          state.sessionId = id;
          render();
        } else if (action === "tab") {
          state.rightTab = id;
          render();
        } else if (action === "drawer-open") {
          state.drawerOpen = true;
          render();
        } else if (action === "drawer-close") {
          state.drawerOpen = false;
          render();
        } else if (action === "ctab") {
          if (id !== "overview" && !state.tabs.includes(id)) state.tabs.push(id);
          state.cTab = id;
          render();
        } else if (action === "ctab-close") {
          e.stopPropagation();
          state.tabs = state.tabs.filter((t) => t !== id);
          if (state.cTab === id) state.cTab = "overview";
          render();
        }
      });

      render();
    </script>
  </body>
</html>
