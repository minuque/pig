<!doctype html>
<html lang="zh-CN" data-accent-color="indigo" data-gray-color="slate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pig 架构看板</title>
    <style>
      /*__CSS__*/
    </style>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: var(--text-body--line-height);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm) var(--space-lg);
        align-items: center;
        padding: var(--space-sm) var(--space-lg);
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
      }

      h1 {
        margin: 0;
        font-size: var(--text-title);
        font-weight: 600;
      }

      h2 {
        margin: 0 0 var(--space-xs);
        font-size: var(--text-title);
        font-weight: 600;
      }

      .meta,
      .hint {
        color: var(--foreground-faint);
        font-size: var(--text-meta);
      }

      nav {
        display: flex;
        gap: var(--space-xxs);
      }

      nav a {
        padding: var(--space-xxs) var(--space-sm);
        border-radius: var(--radius-control);
        color: var(--foreground-secondary);
        text-decoration: none;
      }

      nav a:hover {
        background: var(--btn-hover);
      }

      nav a[aria-current="page"] {
        background: var(--btn-selected);
        color: var(--foreground);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--space-lg);
        padding: var(--space-lg);
      }

      .card {
        padding: var(--space-md);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }

      .diagram {
        overflow: hidden;
        min-height: 240px;
        max-height: 72vh;
        cursor: grab;
      }

      /* 依赖图的边是主要信息，深色下不能用边框色 */
      .dark .diagram {
        --pele-line: var(--foreground-faint);
      }

      .matrix {
        overflow: auto;
        max-height: 72vh;
      }

      .matrix table {
        width: auto;
        font-family: var(--font-mono);
        font-size: var(--text-meta);
      }

      .matrix th {
        position: sticky;
        background: var(--surface);
        font-weight: 400;
        white-space: nowrap;
      }

      .matrix th.col {
        top: 0;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        text-align: left;
      }

      .matrix th.row {
        left: 0;
      }

      .matrix td {
        min-width: 2.2em;
        padding: 0;
        border: 1px solid var(--border);
        text-align: center;
        vertical-align: middle;
      }

      .matrix td[data-self] {
        background: var(--btn-hover);
      }

      .matrix td[data-cycle] {
        background: var(--danger-bg);
        color: var(--danger);
      }

      .matrix td[data-selected] {
        box-shadow: inset var(--focus-ring);
      }

      .matrix button {
        width: 100%;
        padding: var(--space-xxs);
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .matrix button:hover {
        background: var(--btn-hover);
      }

      h3 {
        margin: var(--space-sm) 0 var(--space-xxs);
        color: var(--foreground-secondary);
        font-size: var(--text-body);
        font-weight: 500;
      }

      summary {
        cursor: pointer;
      }

      .crumbs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xxs);
        align-items: center;
        margin-bottom: var(--space-sm);
      }

      .crumbs a::after {
        content: " /";
        color: var(--foreground-faint);
      }

      a {
        color: var(--link);
      }

      code,
      .mono {
        font-family: var(--font-mono);
        font-size: var(--text-meta);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: var(--space-xxs) var(--space-xs);
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--foreground-secondary);
        font-weight: 500;
      }

      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: var(--space-lg);
      }

      ol {
        margin: var(--space-xs) 0 0;
        padding-left: var(--space-lg);
      }

      .tag {
        padding: 0 var(--space-xs);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        color: var(--foreground-secondary);
        font-size: var(--text-meta);
      }

      .error {
        color: var(--red-11);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>pig 架构看板</h1>
      <nav>
        <a href="#overview">总览</a>
        <a href="#dep/">依赖</a>
        <a href="#flows">数据流</a>
        <a href="#api">接口</a>
      </nav>
      <span class="meta" id="meta"></span>
    </header>
    <main id="view"></main>
    <script>
      /*__PELE__*/
    </script>
    <script>
      /*__PANZOOM__*/
    </script>
    <script>
      const DATA = /*__DATA__*/
      const { files, edges } = DATA.graph
      const byId = new Map(files.map((f) => [f.id, f]))
      const view = document.getElementById("view")

      const dark = matchMedia("(prefers-color-scheme: dark)")
      const applyTheme = () => document.documentElement.classList.toggle("dark", dark.matches)
      applyTheme()
      dark.addEventListener("change", () => {
        applyTheme()
        route()
      })

      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
      const label = (s) => String(s).replace(/"/g, "'")
      const tail = (id, parent) => (parent && id.startsWith(`${parent}/`) ? id.slice(parent.length + 1) : id)
      const depLink = (id, text = id) => `<a class="mono" href="#dep/${esc(id)}">${esc(text)}</a>`

      function card(html) {
        const el = document.createElement("section")
        el.className = "card"
        el.innerHTML = html
        view.append(el)
        return el
      }

      function diagram(parent, source) {
        const box = document.createElement("div")
        box.className = "diagram mermaid-diagram"
        parent.append(box)

        try {
          box.innerHTML = pele.render(source, { links: true, responsive: false }).svg
          const svg = box.querySelector("svg")
          const fit = box.clientWidth / svg.getBoundingClientRect().width
          const zoom = Panzoom(svg, { origin: "0 0", maxScale: 6, minScale: 0.2, startScale: Math.min(1, Math.max(0.6, fit)) })
          box.addEventListener("wheel", zoom.zoomWithWheel)
        } catch (error) {
          box.innerHTML = `<p class="error">${esc(error.message)}</p>`
        }
      }

      const dirPkg = new Map(files.map((f) => [f.dir, f.pkg]))
      const pkgOf = (focus) => (dirPkg.has(focus) ? dirPkg.get(focus) : focus)
      const short = (key, focus) => tail(key, focus).replace(/^src\//, "")
      const importers = new Map()
      const imports = new Map()
      for (const e of edges) {
        if (!importers.has(e.to)) importers.set(e.to, [])
        if (!imports.has(e.from)) imports.set(e.from, [])
        importers.get(e.to).push(e.from)
        imports.get(e.from).push(e.to)
      }

      function crumbs(path) {
        const parts = [`<a href="#dep/">全部</a>`]
        const file = byId.get(path)
        const pkg = file?.pkg ?? (path ? pkgOf(path) : undefined)
        const dir = file?.dir ?? (dirPkg.has(path) ? path : undefined)
        if (pkg) parts.push(depLink(pkg))
        if (dir && dir !== pkg) parts.push(depLink(dir, tail(dir, pkg)))
        if (file) parts.push(`<span class="mono">${esc(tail(file.id, file.dir))}</span>`)
        return `<div class="crumbs">${parts.join("")}</div>`
      }

      /** 文件按目录折叠，目录按文件数从多到少。 */
      function grouped(ids) {
        const groups = Map.groupBy(ids, (id) => byId.get(id).dir)
        if (!groups.size) return `<p class="hint">无</p>`
        return [...groups]
          .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]))
          .map(([dir, list]) => {
            const items = list
              .sort()
              .map((id) => `<li>${depLink(id, tail(id, dir))}</li>`)
              .join("")
            return `<details><summary><span class="mono">${esc(`${dirPkg.get(dir)}/${short(dir, dirPkg.get(dir))}`)}</span> <span class="hint">${list.length}</span></summary><ol>${items}</ol></details>`
          })
          .join("")
      }

      /** 矩阵：行引用列，格子是 import 条数；越往后越底层。 */
      function renderMatrix(focus) {
        const { order, cycles } = DATA.layers[focus]
        const keyOf = (f) => (focus ? f.dir : f.pkg)
        const cycleOf = new Map(cycles.flatMap((c, i) => c.map((k) => [k, i])))
        const pairs = new Map()
        for (const e of edges) {
          const [a, b] = [byId.get(e.from), byId.get(e.to)]
          if (focus && (a.pkg !== focus || b.pkg !== focus)) continue
          const key = `${keyOf(a)}\n${keyOf(b)}`
          if (keyOf(a) !== keyOf(b)) pairs.set(key, [...(pairs.get(key) ?? []), e])
        }
        const name = (k) => depLink(k, short(k, focus))
        const head = order.map((k) => `<th class="col">${name(k)}</th>`).join("")
        const rows = order
          .map((row) => {
            const cells = order.map((col) => {
              if (row === col) return `<td data-self></td>`
              const list = pairs.get(`${row}\n${col}`)
              if (!list) return `<td></td>`
              const cycle = cycleOf.has(row) && cycleOf.get(row) === cycleOf.get(col)
              const title = `${short(row, focus)} → ${short(col, focus)}`
              return `<td${cycle ? " data-cycle" : ""}><button data-pair="${esc(`${row}\n${col}`)}" title="${esc(title)}">${list.length}</button></td>`
            })
            return `<tr><th class="row">${name(row)}</th>${cells.join("")}</tr>`
          })
          .join("")
        const cycleNote = cycles.length
          ? `<p class="error">循环引用：${cycles.map((c) => c.map((k) => esc(short(k, focus))).join(" ⇄ ")).join("；")}</p>`
          : ""
        const el = card(
          `${crumbs(focus)}<p class="hint">行引用列，数字是 import 条数。越往右下越底层，红格是循环引用。点数字看具体文件，点名字下钻。</p>${cycleNote}<div class="matrix"><table><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`,
        )
        const detail = card(`<p class="hint">点矩阵里的数字，这里列出对应的文件。</p>`)
        el.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-pair]")
          if (!button) return
          el.querySelector("[data-selected]")?.removeAttribute("data-selected")
          button.parentElement.setAttribute("data-selected", "")
          const [from, to] = button.dataset.pair.split("\n")
          const list = pairs.get(button.dataset.pair)
          const items = list.map((e) => `<li>${depLink(e.from)} → ${depLink(e.to, tail(e.to, to))}</li>`).join("")
          detail.innerHTML = `<h2>${esc(short(from, focus))} → ${esc(short(to, focus))}（${list.length}）</h2><ol>${items}</ol>`
        })
      }

      function renderDir(dir) {
        const rows = files
          .filter((f) => f.dir === dir)
          .map((f) => [f.id, importers.get(f.id)?.length ?? 0, imports.get(f.id)?.length ?? 0])
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([id, into, out]) => `<tr><td>${depLink(id, tail(id, dir))}</td><td>${into}</td><td>${out}</td></tr>`)
          .join("")
        card(
          `${crumbs(dir)}<table><thead><tr><th>文件</th><th>被引用</th><th>引用</th></tr></thead><tbody>${rows}</tbody></table>`,
        )
      }

      /** 反向逐层展开：第 1 层是直接引用方，之后是间接受影响的文件。 */
      function impactLayers(path) {
        const seen = new Set([path])
        const layers = []
        let front = [path]
        while (front.length) {
          front = [...new Set(front.flatMap((id) => importers.get(id) ?? []))].filter((id) => !seen.has(id))
          for (const id of front) seen.add(id)
          if (front.length) layers.push(front)
        }
        return layers
      }

      function renderFile(path) {
        const layers = impactLayers(path)
        const total = layers.reduce((n, l) => n + l.length, 0)
        const impact = layers.map((l, i) => `<h3>${i ? `第 ${i + 1} 层` : "直接引用"}（${l.length}）</h3>${grouped(l)}`).join("")
        const out = imports.get(path) ?? []
        card(
          `${crumbs(path)}<div class="cols"><div><h2>谁引用它（共波及 ${total}）</h2>${impact || '<p class="hint">无</p>'}</div><div><h2>它引用谁（${out.length}）</h2>${grouped(out)}</div></div>`,
        )
      }

      function renderDeps(path) {
        if (byId.has(path)) return renderFile(path)
        if (dirPkg.has(path)) return renderDir(path)
        const { order } = DATA.layers[path]
        if (path && order.length < 2) return renderDir(order[0])
        renderMatrix(path)
      }

      function renderOverview() {
        const pkgs = [...new Set(files.map((f) => f.pkg))]
        const n = (p) => `p${pkgs.indexOf(p)}`
        const counts = new Map()
        for (const e of edges) {
          const a = byId.get(e.from).pkg
          const b = byId.get(e.to).pkg
          if (a !== b) counts.set(`${n(a)} --> ${n(b)}`, (counts.get(`${n(a)} --> ${n(b)}`) ?? 0) + 1)
        }
        const lines = ["flowchart TB"]
        for (const p of pkgs) {
          const size = files.filter((f) => f.pkg === p).length
          lines.push(`  ${n(p)}["${p}<br/>${size} 个文件"]`, `  click ${n(p)} href "#dep/${p}"`)
        }
        for (const [pair, count] of counts) lines.push(`  ${pair.replace("-->", `-->|${count}|`)}`)
        for (const [from, to, text] of DATA.runtime) {
          const a = pkgs.includes(from) ? n(from) : `x${label(from).replace(/\W/g, "")}`
          const b = pkgs.includes(to) ? n(to) : `x${label(to).replace(/\W/g, "")}`
          if (!pkgs.includes(from)) lines.push(`  ${a}(["${label(from)}"])`)
          if (!pkgs.includes(to)) lines.push(`  ${b}(["${label(to)}"])`)
          lines.push(`  ${a} -.->|${label(text)}| ${b}`)
        }
        const el = card(
          `<h2>总览</h2><p class="hint">实线是 import（数字为条数），虚线是运行时通道；点包进入依赖下钻。</p>`,
        )
        diagram(el, lines.join("\n"))
      }

      function renderFlows() {
        for (const flow of DATA.flows) {
          const actors = [...new Set(flow.steps.flatMap((s) => [s.from, s.to]))]
          const a = (name) => `a${actors.indexOf(name)}`
          const lines = ["sequenceDiagram", ...actors.map((name) => `  participant ${a(name)} as ${name}`)]
          flow.steps.forEach((s, i) => lines.push(`  ${a(s.from)}->>${a(s.to)}: ${i + 1}. ${s.text.replace(/[;#]/g, "，")}`))
          const steps = flow.steps
            .map((s) => {
              const [path, symbol] = (s.ref ?? "").split("#")
              const ref = path ? `${depLink(path)}${symbol ? ` <code>${esc(symbol)}</code>` : ""}` : ""
              return `<li>${esc(s.text)}<br/>${ref}</li>`
            })
            .join("")
          const el = card(`<h2 id="flow-${flow.id}">${esc(flow.title)} <span class="tag">${flow.channel}</span></h2>`)
          diagram(el, lines.join("\n"))
          el.insertAdjacentHTML("beforeend", `<ol>${steps}</ol>`)
        }
      }

      function renderApi() {
        const rows = DATA.api.http
          .map(
            (r) =>
              `<tr><td class="mono">${r.method}</td><td class="mono">${esc(r.path)}</td><td>${depLink(r.handler, tail(r.handler, "packages/gateway/src"))}</td><td>${r.callers.map((c) => depLink(c, tail(c, "apps/web/src"))).join("<br/>") || '<span class="hint">无</span>'}</td></tr>`,
          )
          .join("")
        card(
          `<h2>HTTP（${DATA.api.http.length}）</h2><table><thead><tr><th>方法</th><th>路径</th><th>处理</th><th>web 调用方</th></tr></thead><tbody>${rows}</tbody></table>`,
        )
        const list = (items) => `<ol>${items.map((x) => `<li class="mono">${esc(x)}</li>`).join("")}</ol>`
        card(
          `<h2>WebSocket <code>${esc(DATA.api.ws.path)}</code></h2><div class="cols"><div><h2>命令</h2>${list(DATA.api.ws.commands)}</div><div><h2>事件</h2>${list(DATA.api.ws.events)}</div></div>`,
        )
      }

      function route() {
        const hash = decodeURIComponent(location.hash.slice(1)) || "overview"
        const tab = hash.startsWith("dep/") ? "#dep/" : `#${hash}`
        for (const a of document.querySelectorAll("nav a"))
          a.toggleAttribute("aria-current", a.getAttribute("href") === tab)
        document.querySelector("nav a[aria-current]")?.setAttribute("aria-current", "page")
        view.replaceChildren()
        if (hash.startsWith("dep/")) renderDeps(hash.slice(4))
        else if (hash === "flows") renderFlows()
        else if (hash === "api") renderApi()
        else renderOverview()
        scrollTo(0, 0)
      }

      document.getElementById("meta").textContent =
        `${DATA.commit} · ${files.length} 个文件 · ${edges.length} 条 import · 生成于 ${DATA.generatedAt}`
      addEventListener("hashchange", route)
      route()
    </script>
  </body>
</html>
