<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pig 架构看板</title>
    <link rel="icon" type="image/png" href="__ICON__" />
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem("pig-arch-theme")
          var dark =
            mode === "dark" ||
            (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch {}
      })()
    </script>
    <style>
      /*__CSS__*/
    </style>
  </head>
  <body>
    <a class="skip-link" href="#view">跳到主要内容</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#overview">
          <img class="brand-icon" src="__ICON__" width="20" height="20" alt="" />
          <span>pig 架构看板</span>
        </a>

        <nav class="main-nav" aria-label="主导航">
          <a href="#overview">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            <span>总览</span>
          </a>
          <a href="#dep/">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 2 9 4.5-9 4.5-9-4.5L12 2Z" />
              <path d="m3 12 9 4.5 9-4.5" />
              <path d="m3 17.5 9 4.5 9-4.5" />
            </svg>
            <span>依赖</span>
          </a>
          <a href="#flows">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="6" cy="6" r="3" />
              <circle cx="18" cy="18" r="3" />
              <path d="M13 6h3a2 2 0 0 1 2 2v7" />
              <path d="M6 9v12" />
            </svg>
            <span>数据流</span>
          </a>
          <a href="#api">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 22v-5" />
              <path d="M9 8V2" />
              <path d="M15 8V2" />
              <path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z" />
            </svg>
            <span>接口</span>
          </a>
        </nav>

        <div class="topbar-actions">
          <button
            class="search-trigger"
            id="open-search"
            type="button"
            aria-label="全局搜索（快捷键 / 或 Ctrl+K）"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <span class="search-trigger-label">搜索…</span>
            <kbd class="kbd">/</kbd>
          </button>

          <span class="commit-pill mono" id="meta-commit"></span>
          <button class="icon-btn" id="theme" type="button"></button>
        </div>
      </div>
    </header>

    <main id="view" class="page" tabindex="-1"></main>
    <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>

    <dialog class="dialog preview-dialog" id="preview" aria-labelledby="preview-title">
      <div class="dialog-head">
        <div class="preview-heading">
          <h2 id="preview-title"></h2>
          <span class="meta mono" id="preview-meta"></span>
        </div>

        <div class="preview-tools">
          <div class="zoom-group">
            <button
              class="icon-btn"
              id="preview-zoom-out"
              type="button"
              aria-label="缩小"
              title="缩小"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
              </svg>
            </button>
            <span class="preview-scale mono num" id="preview-scale">100%</span>
            <button
              class="icon-btn"
              id="preview-zoom-in"
              type="button"
              aria-label="放大"
              title="放大"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
          </div>

          <button class="btn-ghost" id="preview-fit" type="button">适应</button>
          <button class="btn-ghost" id="preview-actual" type="button">100%</button>
          <button class="btn-ghost" id="preview-copy" type="button">复制源码</button>

          <button class="icon-btn" id="preview-close" type="button" aria-label="关闭" title="关闭">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <div class="preview-viewport" id="preview-viewport">
        <div class="preview-stage mermaid-diagram" id="preview-stage"></div>
      </div>
    </dialog>

    <dialog class="dialog search-dialog" id="search-dialog" aria-labelledby="search-title">
      <h2 id="search-title" class="sr-only">全局搜索</h2>

      <div class="search-head">
        <svg
          class="search-head-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>

        <label class="sr-only" for="search-input">搜索文件、模块、数据流或接口</label>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="搜索文件、模块、数据流、HTTP 路由或 WS 消息…"
          role="combobox"
          aria-expanded="true"
          aria-controls="search-results"
          aria-autocomplete="list"
          autocomplete="off"
        />

        <button class="icon-btn" id="search-close" type="button" aria-label="关闭搜索" title="关闭">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果"></div>

      <div class="search-foot">
        <span class="search-count" id="search-count"></span>
        <div class="search-keys" aria-hidden="true">
          <span>
            <kbd class="kbd">↑</kbd>
            <kbd class="kbd">↓</kbd>
            选择
          </span>
          <span>
            <kbd class="kbd">Enter</kbd>
            打开
          </span>
          <span>
            <kbd class="kbd">Esc</kbd>
            关闭
          </span>
        </div>
      </div>
    </dialog>

    <script>
      /*__PELE__*/
    </script>
    <script>
      globalThis.__ARCH_DATA__ = /*__DATA__*/
    </script>
    <script>
      /*__APP__*/
    </script>
  </body>
</html>
