name: Release gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-suite:
    name: Linux Node ${{ matrix.node }} full suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:quick
      - run: npm run test:real-pi
      - if: matrix.node == '22.19.0'
        run: |
          mkdir release-artifact
          npm pack --pack-destination release-artifact --workspace @no-pi-no-gang/contracts
          npm pack --pack-destination release-artifact --workspace no-pi-no-gang
      - if: matrix.node == '22.19.0'
        uses: actions/upload-artifact@v4
        with:
          name: packed-release
          path: release-artifact/*.tgz
          if-no-files-found: error

  unsupported-node-gate:
    name: Reject unsupported Node 22.18
    needs: linux-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packed-release
          path: release-artifact
      - run: node scripts/install-release-artifact.mjs
        env:
          NPNG_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifact
      - run: npm run test:real-pi
        env:
          NPNG_EXPECT_NODE_GATE: "1"
          NPNG_GATEWAY_CLI: ${{ github.workspace }}/.release-install/node_modules/no-pi-no-gang/dist/cli.js

  chromium-critical:
    needs: linux-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packed-release
          path: release-artifact
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance:chromium
        env:
          NPNG_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifact

  browser-smoke:
    needs: linux-suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packed-release
          path: release-artifact
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          NPNG_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifact

  packaged-platform-smoke:
    needs: linux-suite
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packed-release
          path: release-artifact
      - run: node scripts/install-release-artifact.mjs
        env:
          NPNG_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifact
      - run: npm run test:real-pi
        env:
          NPNG_GATEWAY_CLI: ${{ github.workspace }}/.release-install/node_modules/no-pi-no-gang/dist/cli.js
