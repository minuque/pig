<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>pig 指示器 · 5 状态</title>
    <style>
      :root {
        --mascot-body: #fde3b4;
        --mascot-snout: #fda88e;
        --mascot-eye: #012d47;
        --white: #ffffff;
        --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 32px;
        background: #0f1115;
        color: #d1d5db;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 16px;
        font-weight: 600;
      }
      h2 {
        font-size: 12px;
        font-weight: 500;
        color: #9ca3af;
        margin: 24px 0 10px;
        letter-spacing: 0.04em;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 8px 10px;
        background: #16181d;
        border-radius: 6px;
        min-height: 110px;
      }
      .cell .label {
        margin-top: 8px;
        font-size: 11px;
        color: #9ca3af;
      }
      .cell {
        outline: 1px solid transparent;
        transition: outline-color 0.25s;
      }
      .cell.active {
        outline-color: #3b82f6;
      }
      .cell svg {
        height: 48px;
        display: block;
        overflow: visible;
      }
      .ref {
        color: #9ca3af;
        font-size: 11px;
        margin: 4px 0 12px;
      }
      .ref code {
        background: #1f2937;
        padding: 0 4px;
        border-radius: 3px;
      }

      .ear,
      .head {
        fill: var(--mascot-body);
      }
      .snout {
        fill: var(--mascot-snout);
      }
      .eye {
        fill: var(--mascot-eye);
      }
      .glint {
        fill: var(--white);
      }
      .mouth {
        fill: none;
        stroke: var(--mascot-eye);
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .tail {
        fill: none;
        stroke: var(--mascot-snout);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sweat {
        fill: #6fb6ff;
      }
      .zzz {
        fill: var(--mascot-eye);
        font: 700 18px/1 system-ui;
      }
      .open-mouth {
        fill: var(--mascot-eye);
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.02, 0.98);
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: translateX(-3px) rotate(-2.4deg);
        }
        50% {
          transform: translateX(3px) rotate(2.4deg);
        }
      }
      @keyframes sway-fast {
        0%,
        100% {
          transform: translateX(-4px) rotate(-3.4deg);
        }
        50% {
          transform: translateX(4px) rotate(3.4deg);
        }
      }
      @keyframes head-shake {
        0%,
        100% {
          transform: rotate(-4deg);
        }
        50% {
          transform: rotate(4deg);
        }
      }
      @keyframes head-shake-fast {
        0%,
        100% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }
      @keyframes huff {
        0%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-2px);
        }
        70% {
          transform: translateY(-0.6px);
        }
      }
      @keyframes ear-twitch {
        0%,
        84%,
        100% {
          transform: rotate(0);
        }
        88% {
          transform: rotate(-12deg);
        }
        92% {
          transform: rotate(4deg);
        }
      }
      @keyframes sweat-drop {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        18% {
          opacity: 1;
        }
        88% {
          transform: translateY(8px);
          opacity: 0;
        }
        100% {
          transform: translateY(8px);
          opacity: 0;
        }
      }
      @keyframes blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }
      @keyframes tail-wag {
        0%,
        60%,
        100% {
          transform: rotate(0);
        }
        68% {
          transform: rotate(-16deg);
        }
        76% {
          transform: rotate(10deg);
        }
        84% {
          transform: rotate(-8deg);
        }
        92% {
          transform: rotate(4deg);
        }
      }
      @keyframes tail-wag-fast {
        0%,
        100% {
          transform: rotate(-14deg);
        }
        50% {
          transform: rotate(14deg);
        }
      }
      @keyframes zzz-float {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        20% {
          opacity: 0.9;
        }
        80% {
          opacity: 0.9;
        }
        100% {
          transform: translate(8px, -14px);
          opacity: 0;
        }
      }
      @keyframes blush-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.18);
          opacity: 1;
        }
      }
      @keyframes steam-rise {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        30% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-14px);
          opacity: 0;
        }
      }

      .pig .g {
        transform-box: fill-box;
        transform-origin: 50% 60%;
      }
      .pig .ear-l {
        transform-box: fill-box;
        transform-origin: 61% 72%;
      }
      .pig .ear-r {
        transform-box: fill-box;
        transform-origin: 39% 72%;
      }
      .pig .eyes {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .pig .tail {
        transform-box: fill-box;
        transform-origin: 20% 100%;
      }
      .pig .sweat {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .pig .blush {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* ===== 5 状态 ===== */
      .pig.idle .g {
        animation: breathe 3.2s var(--ease-in-out) infinite;
      }
      .pig.run .g {
        animation: sway 0.55s var(--ease-in-out) infinite;
      }
      .pig.long .g {
        animation:
          sway 0.5s var(--ease-in-out) infinite,
          head-shake 0.5s var(--ease-in-out) infinite;
      }
      .pig.xlong .g {
        animation:
          sway-fast 0.32s var(--ease-in-out) infinite,
          head-shake-fast 0.32s var(--ease-in-out) infinite,
          huff 0.32s var(--ease-in-out) infinite;
      }
      .pig.ready .g {
        animation: sway 1s var(--ease-in-out) infinite;
      }

      .pig.idle .ear-r {
        animation: ear-twitch 4s linear infinite;
      }
      .pig.long .sweat,
      .pig.xlong .sweat {
        animation: sweat-drop 0.9s linear infinite;
      }
      .pig.long .sweat-2,
      .pig.xlong .sweat-2 {
        animation-delay: -0.45s;
      }
      .pig:not(.long):not(.xlong) .sweat {
        display: none;
      }
      .pig.ready .eyes {
        animation: blink 3.4s linear infinite;
      }
      .pig.idle .tail {
        animation: tail-wag 3.6s var(--ease-in-out) infinite;
      }
      .pig.run .tail {
        animation: tail-wag-fast 0.55s var(--ease-in-out) infinite;
      }
      .pig.long .tail {
        animation: tail-wag-fast 0.5s var(--ease-in-out) infinite;
      }
      .pig.xlong .tail {
        animation: tail-wag-fast 0.32s var(--ease-in-out) infinite;
      }
      .pig.ready .tail {
        animation: tail-wag 1.6s var(--ease-in-out) infinite;
      }

      .pig.zzz-on .zzz {
        display: block;
      }
      .pig .zzz {
        display: none;
      }
      .pig.zzz-on .zzz-1 {
        animation: zzz-float 3s linear infinite;
      }
      .pig.zzz-on .zzz-2 {
        animation: zzz-float 3s linear infinite;
        animation-delay: -1.5s;
        font-size: 14px;
      }

      /* 5min：腮红扩散 */
      .pig .blush {
        opacity: 0;
      }
      .pig.long .blush {
        opacity: 0.8;
        animation: blush-pulse 0.6s var(--ease-in-out) infinite;
      }

      /* 10min：红温 + 蒸汽 */
      .pig.xlong .head,
      .pig.xlong .ear {
        fill: #f5a896;
      }
      .pig.xlong .snout {
        fill: #e0735e;
      }
      .pig .steam {
        opacity: 0;
      }
      .pig.xlong .steam {
        opacity: 1;
      }
      .pig.xlong .steam path {
        animation: steam-rise 1.1s linear infinite;
        opacity: 0;
      }
      .pig.xlong .steam path:nth-child(2) {
        animation-delay: -0.36s;
      }
      .pig.xlong .steam path:nth-child(3) {
        animation-delay: -0.72s;
      }

      /* ===== turn 生命周期模拟 ===== */
      .lifecycle {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      .turn-status {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        font-size: 12px;
        color: #9ca3af;
        transition: opacity 0.35s ease;
      }
      .turn-status svg {
        height: 18px;
        display: block;
        overflow: visible;
      }
      .turn-status.out {
        opacity: 0;
      }
      .turn-status .dot {
        margin-inline: 0.35em;
        font-weight: 700;
      }
      .replay {
        align-self: flex-start;
        background: #1f2937;
        border: 0;
        border-radius: 5px;
        color: #d1d5db;
        font-size: 11px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .replay:hover {
        background: #374151;
      }
      .stage {
        color: #6b7280;
        font-size: 11px;
      }
      .controls {
        display: flex;
        gap: 6px;
        margin: 8px 0 14px;
        flex-wrap: wrap;
      }
      .controls button {
        background: #1f2937;
        border: 0;
        border-radius: 5px;
        color: #d1d5db;
        font-size: 11px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .controls button:hover {
        background: #374151;
      }
      .controls button.active {
        background: #3b82f6;
        color: #fff;
      }
      .controls .sep {
        width: 1px;
        background: #374151;
        margin-inline: 4px;
      }
    </style>
  </head>

    <h2>turn 生命周期：run → ready 常驻</h2>

              d="M40 24L42 14.5C37 9.5 27 3.5 21 3.8 16.5 4 15 7 15 12c0 6 .5 14 3 22L24 46 46 34z"
            />
            <path
              class="ear ear-r"
              d="M88 24l-2-9.5c5-5 15-11 21-10.7 4.5.2 6 3.2 6 8.2 0 6-.5 14-3 22L104 46 82 34z"
            />
            <path class="head" d="M11.84 100.86a60 60 0 1 1 104.32 0z" />
            <g class="face">
              <ellipse class="snout" cx="64" cy="63.5" rx="17.14" ry="10.84" />
              <ellipse id="ts-mouth-open" class="open-mouth" cx="64" cy="80" rx="5" ry="3" />
              <path
                id="ts-mouth-smile"
                class="mouth"
                d="M55 80.14q9 8 18 0"
                style="display: none"
              />
              <g class="eyes">
                <ellipse class="eye" cx="41.56" cy="50.9" rx="5.04" ry="5.8" />
                <ellipse class="eye" cx="86.44" cy="50.9" rx="5.04" ry="5.8" />
                <circle class="glint" cx="42.06" cy="48.1" r="1.76" />
                <circle class="glint" cx="86.94" cy="48.1" r="1.76" />
              </g>
            </g>
          </g>
        </svg>
        <span id="ts-label">
          工作中
          <span class="dot">·</span>
          <span id="ts-elapsed">0s</span>
        </span>
      </div>
      <div>
        <span class="stage" id="stage"></span>
      </div>
    </div>

    <script>
      const ts = document.getElementById("ts")
      const pig = document.getElementById("ts-pig")
      const label = document.getElementById("ts-label")
      const elapsed = document.getElementById("ts-elapsed")
      const mouthOpen = document.getElementById("ts-mouth-open")
      const mouthSmile = document.getElementById("ts-mouth-smile")
      const stage = document.getElementById("stage")
      const sweat1 = pig.querySelector(".sweat-1")
      const sweat2 = pig.querySelector(".sweat-2")
      const blushWrap = pig.querySelector(".face")
      const ctlBtns = [...document.querySelectorAll("#ctl button[data-state]")]
      const playBtn = document.getElementById("play")

      let blush1, blush2, steam
      function ensureParts() {
        if (!blush1) {
          blush1 = document.createElementNS("http://www.w3.org/2000/svg", "circle")
          blush1.setAttribute("class", "blush")
          blush1.setAttribute("cx", "30")
          blush1.setAttribute("cy", "60")
          blush1.setAttribute("r", "10")
          blush2 = blush1.cloneNode()
          blush2.setAttribute("cx", "98")
          blushWrap.prepend(blush2)
          blushWrap.prepend(blush1)
          steam = document.createElementNS("http://www.w3.org/2000/svg", "g")
          steam.setAttribute("class", "steam")
          steam.innerHTML =
            '<path d="M50 18q3-5 0-9t0-8"/><path d="M64 14q3-5 0-9t0-8"/><path d="M78 18q3-5 0-9t0-8"/>'
          pig.querySelector(".g").insertBefore(steam, blushWrap)
        }
      }
      ensureParts()

      let tickTimer = null
      let cycleTimers = []
      let playing = false

      function stopTimers() {
        if (tickTimer) clearInterval(tickTimer)
        for (const t of cycleTimers) clearTimeout(t)
        tickTimer = null
        cycleTimers = []
        playing = false
        playBtn.textContent = "▶ 播放周期"
      }

      function setState(state, withLabel) {
        pig.setAttribute("class", "pig " + state + (state === "idle" ? " zzz-on" : ""))
        pig
          .querySelectorAll(".zzz")
          .forEach((z) => (z.style.display = state === "idle" ? "" : "none"))
        const hasSweat = state === "long" || state === "xlong"
        sweat1.style.display = hasSweat ? "" : "none"
        sweat2.style.display = hasSweat ? "" : "none"
        blush1.style.display = state === "long" ? "" : "none"
        blush2.style.display = state === "long" ? "" : "none"
        steam.style.display = state === "xlong" ? "" : "none"
        const openMouth = state === "run" || state === "long" || state === "xlong"
        mouthOpen.style.display = openMouth ? "" : "none"
        mouthOpen.setAttribute("rx", state === "run" ? 5 : 6)
        mouthOpen.setAttribute("ry", state === "run" ? 3 : 4)
        mouthSmile.style.display = state === "idle" || state === "ready" ? "" : "none"
        mouthSmile.setAttribute(
          "d",
          state === "idle" ? "M57.05 80.14q6.95 6 13.9 0" : "M55 80.14q9 8 18 0",
        )
        const eyes = pig.querySelector(".eyes")
        if (state === "idle") {
          eyes.innerHTML =
            '<path class="eye" d="M36 51c2 3 5 4 10 4M82 51c2 3 5 4 10 4" stroke="var(--mascot-eye)" stroke-width="2.5" stroke-linecap="round" fill="none"/>'
        } else {
          eyes.innerHTML =
            '<ellipse class="eye" cx="41.56" cy="50.9" rx="5.04" ry="5.8"/><ellipse class="eye" cx="86.44" cy="50.9" rx="5.04" ry="5.8"/><circle class="glint" cx="42.06" cy="48.1" r="1.76"/><circle class="glint" cx="86.94" cy="48.1" r="1.76"/>'
        }
        label.style.display = withLabel ? "" : "none"
        ctlBtns.forEach((b) => b.classList.toggle("active", b.dataset.state === state))
        document
          .querySelectorAll(".cell[data-state]")
          .forEach((c) => c.classList.toggle("active", c.dataset.state === state))
      }

      function manual(state) {
        stopTimers()
        setState(state, false)
        stage.textContent = "手动：" + state
      }

      function play() {
        stopTimers()
        playing = true
        playBtn.textContent = "■ 停止"

        let s = 0
        elapsed.textContent = "0s"
        setState("run", true)
        stage.textContent = "阶段：run"

        tickTimer = setInterval(() => {
          s += 1
          elapsed.textContent = s + "s"
          if (s === 5) {
            setState("long", true)
            stage.textContent = "阶段：long（5min）"
          }
          if (s === 10) {
            setState("xlong", true)
            stage.textContent = "阶段：xlong（10min）"
          }
        }, 1000)

        cycleTimers.push(
          setTimeout(() => {
            clearInterval(tickTimer)
            tickTimer = null
            setState("ready", false)
            stage.textContent = "阶段：ready（常驻）"
            playing = false
            playBtn.textContent = "▶ 播放周期"
          }, 12500),
        )
      }

      ctlBtns.forEach((b) => b.addEventListener("click", () => manual(b.dataset.state)))
      playBtn.addEventListener("click", () =>
        playing ? (stopTimers(), (stage.textContent = "已停止")) : play(),
      )
      play()
    </script>
  </body>
</html>
